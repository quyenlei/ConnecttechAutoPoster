# Pushing a tag v<version> (matching package.json, with a CHANGELOG section) checks, builds and publishes it:
# Connecttech launcher installers for Windows, macOS (Apple silicon and Intel) and Linux are built first; then the
# GitHub release with the zip, the helper installers and the launcher, then update.json on the `update` branch.
# The launcher is not code-signed yet: users allow it once (see HUONG_DAN_CAI_DAT.md).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  launcher:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: launcher/package.json
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        if: matrix.target != 'x86_64-apple-darwin'
      - run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.target }}
          if-no-files-found: error
          path: |
            launcher/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            launcher/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            launcher/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            launcher/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb

  release:
    needs: launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - uses: actions/download-artifact@v4
        with:
          pattern: launcher-*
          merge-multiple: true
          path: .output/launcher
      - run: ls -la .output/launcher
      - run: node scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
