# Release pipeline: runs when a pull request is merged into main (any push to main). Other branches never release.
# When package.json's version has no release `v<version>` yet: typecheck, tests, then scripts/release.mjs (zip +
# release `v<version>` with the CHANGELOG.md section + update.json on the `update` branch). A merge that keeps an
# already released version publishes nothing. To release: bump package.json and add a CHANGELOG section in the PR.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      cap_new: ${{ steps.cap.outputs.new }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: cap
        run: |
          # 200: released already, skip. 404: new version, release. Anything else: stop and show why.
          tag="v$(node -p "require('./package.json').version")"
          status=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --silent -i 2>/dev/null | head -1 | awk '{print $2}')
          echo "GitHub answered $status for $tag"
          case "$status" in
            200) echo "new=false" >> "$GITHUB_OUTPUT"; echo "$tag is already released." ;;
            404) echo "new=true" >> "$GITHUB_OUTPUT"; echo "$tag will be released." ;;
            *) gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --silent; echo "Could not tell whether $tag exists."; exit 1 ;;
          esac

  cap-release:
    name: CAP release
    needs: check
    if: needs.check.outputs.cap_new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
