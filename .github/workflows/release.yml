# Release pipeline: runs when a pull request is merged into main (any push to main). Other branches never release.
# - If package.json's version already has a GitHub release, nothing happens (a PR that did not bump the version).
# - Otherwise: build the Connecttech app for Windows, macOS (Apple silicon and Intel) and Linux, create the tag
#   v<version> on that commit and the GitHub release with the CAP zip and the app installers (CHANGELOG section as
#   notes), then point update.json on the `update` branch at it.
# To release: in your PR, bump the version in package.json and launcher/src-tauri/Cargo.toml and add a CHANGELOG
# section for it; merging the PR publishes it.
# App installers carry fixed names, so https://github.com/<repo>/releases/latest/download/<name> always works:
#   Connecttech-windows-x64-setup.exe, Connecttech-mac-arm64.dmg, Connecttech-mac-x64.dmg,
#   Connecttech-linux-amd64.AppImage, Connecttech-linux-amd64.deb
# The app is not notarized yet: users allow it once (Windows SmartScreen, macOS Privacy & Security).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 200: released already, skip. 404: new version, release. Anything else: stop and show why.
          status=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" --silent -i 2>/dev/null | head -1 | awk '{print $2}')
          echo "GitHub answered $status for v$version"
          case "$status" in
            200) echo "new=false" >> "$GITHUB_OUTPUT"; echo "v$version is already released; nothing to do." ;;
            404) echo "new=true" >> "$GITHUB_OUTPUT"; echo "Releasing v$version." ;;
            *) gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" --silent; echo "Could not tell whether v$version exists."; exit 1 ;;
          esac

  launcher:
    name: app (${{ matrix.name }})
    needs: check
    if: needs.check.outputs.new == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: mac-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: mac-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - name: linux-amd64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: launcher/package.json
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        if: matrix.target != 'x86_64-apple-darwin'
      - run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Check the mac app signature
        if: runner.os == 'macOS'
        # Ad-hoc signing of the whole bundle (tauri.conf signingIdentity "-"). Without it macOS calls a downloaded
        # app "damaged" instead of offering Open Anyway.
        run: |
          dmg=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -1)
          mount=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | awk -F'\t' '{print $NF}')
          codesign --verify --deep --strict --verbose=2 "$mount/Connecttech.app"
          hdiutil detach -quiet "$mount"
      - name: Collect installers under fixed names
        run: |
          bundle=src-tauri/target/${{ matrix.target }}/release/bundle
          mkdir -p ../dist-app
          for f in "$bundle"/nsis/*.exe;           do [ -f "$f" ] && cp "$f" "../dist-app/Connecttech-${{ matrix.name }}-setup.exe"; done
          for f in "$bundle"/dmg/*.dmg;            do [ -f "$f" ] && cp "$f" "../dist-app/Connecttech-${{ matrix.name }}.dmg"; done
          for f in "$bundle"/appimage/*.AppImage;  do [ -f "$f" ] && cp "$f" "../dist-app/Connecttech-${{ matrix.name }}.AppImage"; done
          for f in "$bundle"/deb/*.deb;            do [ -f "$f" ] && cp "$f" "../dist-app/Connecttech-${{ matrix.name }}.deb"; done
          ls -la ../dist-app
          [ -n "$(ls ../dist-app)" ] || { echo "no installer built"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.name }}
          path: dist-app/*
          if-no-files-found: error

  release:
    needs: [check, launcher]
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          merge-multiple: true
          path: .output/launcher
      - run: ls -la .output/launcher
      - name: Publish
        run: node scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
