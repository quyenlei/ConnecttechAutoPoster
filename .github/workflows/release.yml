# Pushing a tag v<version> (matching package.json, with a CHANGELOG section) checks, builds and publishes it:
# GitHub release with the zip, then update.json on the `update` branch for the in-extension update check.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
