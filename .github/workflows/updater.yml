# Tests the updater helper on the systems users run: Windows (PowerShell 5.1 through cmd.exe, as Chrome starts it)
# macOS (bash, plus the one-click update end to end in Chrome) and Linux (bash). Uses local mocks only, never GitHub releases.
name: Updater

on:
  pull_request:
  push:
    branches: [main]

jobs:
  helper:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python updater/test/helper_test.py

  one-click:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec wxt build
      - run: pip install playwright && python -m playwright install chromium
      - run: python e2e/updater_e2e.py .output/chrome-mv3
