# Builds and tests the Connecttech launcher (launcher/, Tauri) on the systems users run. Local mocks only.
name: Launcher

# Only when the app changes (CAP-only changes do not build it).
on:
  pull_request:
    paths: ['launcher/**', '.github/workflows/launcher.yml']
  push:
    branches: [main]
    paths: ['launcher/**', '.github/workflows/launcher.yml']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: launcher/package.json
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      - run: pnpm install
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: pnpm tauri build --debug --no-bundle
